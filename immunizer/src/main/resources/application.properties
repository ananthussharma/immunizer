spring.application.name=immunizer

# --- DataSource (MySQL) ----------------------------------------------------
# Database: immunizer on localhost:3306
spring.datasource.url=jdbc:mysql://localhost:3306/immunizer
spring.datasource.username=root
spring.datasource.password=Akhil
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate -------------------------------------------------------
# For demo: update will create/alter tables automatically. Change to 'validate' or remove for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=true

# Optional: tune connection pool (if using HikariCP defaults are OK)
# spring.datasource.hikari.maximum-pool-size=10
